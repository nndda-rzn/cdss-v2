[project]
name = "ekg-insight-backend"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "flask>=3.0",
  "flask-sqlalchemy>=3.1",
  "flask-migrate>=4.0",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "pydantic>=2.6",
  "flask-jwt-extended>=4.6",
  "bcrypt>=5.0.0",
  "cryptography>=42.0",
  "structlog>=24.1",
  "python-dotenv>=1.0",
  "email-validator>=2.0",
  "opencv-python-headless>=4.9",
  "pillow>=10.2",
  "numpy>=1.26",
  "scipy>=1.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=4.1", "ruff>=0.3", "mypy>=1.9", "httpx>=0.27"]
# YOLO inference runtime (pulls torch ~700MB CPU / ~2GB CUDA). Not needed for
# CI or tests (loader is lazy-imported and mocked); install locally for real
# model serving: pip install -e ".[inference]"
inference = ["ultralytics>=8.4", "matplotlib>=3.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "S"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = []
exclude = ["migrations/"]

[[tool.mypy.overrides]]
module = ["flask_migrate.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# flask-jwt-extended ships untyped decorators (jwt_required); allow them
# only at the API boundary module that uses them.
module = ["app.api.auth"]
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
# Test functions are not strictly typed by convention.
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false

[[tool.mypy.overrides]]
# Top-level scripts package (repo root) has no py.typed marker.
module = ["scripts.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# ultralytics/torch: heavy ML deps; treat as untyped third-party so strict
# checks (e.g. implicit-reexport of YOLO) don't apply to vendored code.
module = ["ultralytics.*", "torch.*"]
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
module = ["matplotlib.*", "mpl_toolkits.*"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --import-mode=importlib"
