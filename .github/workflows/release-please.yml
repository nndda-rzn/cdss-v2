name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          release-type: simple
          token: ${{ secrets.GITHUB_TOKEN }}
          # Pre-1.0 prototype: version stays in 0.x until Sprint 8 demo-ready.
          # Tags follow v0.<sprint>.<patch>; annotate releases with sprint name.
