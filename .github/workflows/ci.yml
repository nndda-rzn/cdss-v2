name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel in-progress runs for the same ref
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend:
    name: Backend (lint, type, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Check backend exists
        id: check
        run: echo "exists=$([ -f pyproject.toml ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
        working-directory: .
      - uses: actions/setup-python@v5
        if: steps.check.outputs.exists == 'true'
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        if: steps.check.outputs.exists == 'true'
        run: pip install -e ".[dev]"
      - name: Ruff lint
        if: steps.check.outputs.exists == 'true'
        run: ruff check .
      - name: Mypy type check
        if: steps.check.outputs.exists == 'true'
        run: mypy .
      - name: Pytest
        if: steps.check.outputs.exists == 'true'
        run: pytest --cov --cov-report=xml
      - name: pip-audit
        if: steps.check.outputs.exists == 'true'
        run: pip install pip-audit && pip-audit || true

  frontend:
    name: Frontend (lint, type, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Check frontend exists
        id: check
        run: echo "exists=$([ -f package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
        working-directory: .
      - uses: actions/setup-node@v4
        if: steps.check.outputs.exists == 'true'
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        if: steps.check.outputs.exists == 'true'
        run: npm ci
      - name: ESLint
        if: steps.check.outputs.exists == 'true'
        run: npm run lint
      - name: Prettier check
        if: steps.check.outputs.exists == 'true'
        run: npm run format:check
      - name: Type check
        if: steps.check.outputs.exists == 'true'
        run: npm run typecheck
      - name: Vitest
        if: steps.check.outputs.exists == 'true'
        run: npm run test -- --coverage
      - name: Build
        if: steps.check.outputs.exists == 'true'
        run: npm run build

  docs-lint:
    name: Docs Lint (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: "**/*.md"
