name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel in-progress runs for the same ref
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    # gitleaks-action posts results via the Checks API on pull_request events,
    # which needs a writable GITHUB_TOKEN. Repo default workflow permissions
    # are read-only, so we widen at the job level. Dependabot PRs are forced
    # read-only by GitHub regardless and cannot be widened, so they are
    # skipped here; their diff is workflow YAML only (no app code, no PHI),
    # and Secret Scan still gates push to main and human-authored PRs.
    if: github.actor != 'dependabot[bot]'
    permissions:
      contents: read
      pull-requests: write
      issues: write
      checks: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend:
    name: Backend (lint, type, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - name: Check backend exists
        id: check
        run: echo "exists=$([ -f pyproject.toml ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
        working-directory: .
      - uses: actions/setup-python@v6
        if: steps.check.outputs.exists == 'true'
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        if: steps.check.outputs.exists == 'true'
        run: pip install -e ".[dev]"
      - name: Ruff lint
        if: steps.check.outputs.exists == 'true'
        run: ruff check .
      - name: Mypy type check
        if: steps.check.outputs.exists == 'true'
        run: mypy .
      - name: Pytest
        if: steps.check.outputs.exists == 'true'
        run: pytest --cov --cov-report=xml
      - name: pip-audit
        if: steps.check.outputs.exists == 'true'
        run: pip install pip-audit && pip-audit || true

  frontend:
    name: Frontend (lint, type, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - name: Check frontend exists
        id: check
        run: echo "exists=$([ -f package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
        working-directory: .
      - uses: actions/setup-node@v6
        if: steps.check.outputs.exists == 'true'
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        if: steps.check.outputs.exists == 'true'
        run: npm ci
      - name: ESLint
        if: steps.check.outputs.exists == 'true'
        run: npm run lint
      - name: Prettier check
        if: steps.check.outputs.exists == 'true'
        run: npm run format:check
      - name: Type check
        if: steps.check.outputs.exists == 'true'
        run: npm run typecheck
      - name: Vitest
        if: steps.check.outputs.exists == 'true'
        run: npm run test -- --coverage
      - name: Build
        if: steps.check.outputs.exists == 'true'
        run: npm run build

  docs-lint:
    name: Docs Lint (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - name: markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v23
        with:
          globs: "**/*.md"

  e2e:
    name: E2E (non-blocking)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - name: Check e2e exists
        id: check
        run: echo "exists=$([ -f tests/e2e/package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v6
        if: steps.check.outputs.exists == 'true'
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v6
        if: steps.check.outputs.exists == 'true'
        with:
          node-version: "24"
      - name: Install backend
        if: steps.check.outputs.exists == 'true'
        run: pip install -e ".[dev]"
        working-directory: backend
      - name: Provision secrets + DB
        if: steps.check.outputs.exists == 'true'
        run: |
          python scripts/init_secrets.py
          cd backend && alembic upgrade head
      - name: Install frontend
        if: steps.check.outputs.exists == 'true'
        run: npm ci
        working-directory: frontend
      - name: Install Playwright
        if: steps.check.outputs.exists == 'true'
        run: npm install && npx playwright install --with-deps chromium
        working-directory: tests/e2e
      - name: Run e2e
        if: steps.check.outputs.exists == 'true'
        run: npx playwright test
        working-directory: tests/e2e
